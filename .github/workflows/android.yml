name: Godot tests and Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.4.1
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 'https://downloads.godotengine.org/?version=4.4.1&flavor=stable&slug=linux.x86_64.zip' -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import resources and run all tests
        run: |
          mkdir -p build
          touch build/.gdignore
          "$GODOT_BIN" --headless --path . --editor --import
          python3 tools/run_tests.py
      - name: Install Android export tools
        run: bash tools/install_android_tools.sh
      - name: Export and verify debug APK
        run: bash tools/build_android.sh debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise Android app lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/android_smoke.py
      - name: Upload APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binh-doan-ti-hon-${{ github.sha }}
          path: |
            build/binh-doan-ti-hon-debug.apk
            build/test-results/
            build/android-smoke/
            build/android-import.log
          retention-days: 14
